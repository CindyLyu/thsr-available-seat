name: fetch-and-deploy

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *' # 避開整點擁擠時段；排程仍可能延遲，這是正常的
  workflow_dispatch: # 可在 Actions 頁面手動執行
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個，新的進來時取消舊的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 未來日期的資料每天只在 10、16、22 時更新，用快取避免每次都重抓。
      # key 以「台北時間的更新時段」命名：同一時段內完全命中、不重抓；跨時段時用 restore-keys 取回舊檔再增量更新。
      - name: Compute refresh slot
        id: slot
        run: |
          hm=$(TZ=Asia/Taipei date +%H%M)
          day=$(TZ=Asia/Taipei date +%F)
          if   [ "$((10#$hm))" -ge 2230 ]; then n=3
          elif [ "$((10#$hm))" -ge 1630 ]; then n=2
          elif [ "$((10#$hm))" -ge 1030 ]; then n=1
          else n=0; fi
          echo "key=$day-$n" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: .cache/future
          key: future-seats-${{ steps.slot.outputs.key }}
          restore-keys: future-seats-

      - name: Fetch seat data from TDX
        run: node scripts/fetch_seats.mjs
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
