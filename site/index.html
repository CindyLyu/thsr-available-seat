<style>
  :root {
    --paper: #eef1f4;
    --ink: #16222e;
    --muted: #5d6b79;
    --line: #cfd6dd;
    --board: #121b24;
    --board-line: #263444;
    --board-text: #e8eef4;
    --ok: #46d39a;
    --few: #ffb224;
    --full: #ff7a6b;
    --unk: #8a97a6;
    --focus: #1a73e8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 8px 0 16px; letter-spacing: .02em; }

  .controls {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 8px;
    align-items: end;
  }
  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
  select, button {
    font: inherit;
    width: 100%;
    min-height: 44px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
  }
  select { height: 44px; }
  button { cursor: pointer; width: 44px; height: 44px; align-self: end; padding: 0; font-size: 1.1rem; }
  select:focus-visible, button:focus-visible, input:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }
  .date { margin-bottom: 12px; }
  /* 往下滑時固定住日期與起訖站；固定後收掉小標籤以節省空間 */
  #sentinel { height: 1px; }
  .bar {
    position: sticky;
    top: 0;
    z-index: 10;
    margin: 0 -16px;
    padding: 8px 16px 12px;
    background: var(--paper);
  }
  .bar.stuck { box-shadow: 0 2px 6px rgba(22, 34, 46, .15); padding-bottom: 8px; }
  .bar.stuck label { display: none; }
  .bar.stuck .date { margin-bottom: 8px; }
  /* 寬螢幕：日期與起訖站排同一列 */
  @media (min-width: 640px) {
    .bar { display: grid; grid-template-columns: 190px 1fr; gap: 12px; align-items: end; }
    .date, .bar.stuck .date { margin-bottom: 0; }
  }
  .opts[hidden] { display: none; }
  .opts { margin: 12px 0 0; font-size: .95rem; }
  .opts label { display: inline-flex; gap: 8px; align-items: center; color: var(--ink); font-size: inherit; margin: 0; }
  .opts input { width: 18px; height: 18px; }

  .meta { margin: 16px 0 8px; font-size: .85rem; color: var(--muted); }
  .warn {
    margin: 12px 0 0;
    padding: 10px 12px;
    border-left: 4px solid var(--few);
    background: #fff6e0;
    font-size: .9rem;
  }
  .warn[hidden] { display: none; }

  .board { background: var(--board); color: var(--board-text); border-radius: 8px; overflow: hidden; }
  .head, .row {

  .head { font-size: .8rem; color: #9fb0c0; border-bottom: 1px solid var(--board-line); }
  .row { border-bottom: 1px solid var(--board-line); }
  .row:last-child { border-bottom: 0; }

  .time small { font-size: .85rem; font-weight: 400; color: #9fb0c0; margin-left: 6px; }
  .no { font-variant-numeric: tabular-nums; color: #c5d1dc; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: .95rem; }
  .chip::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
  .O { color: var(--ok); }
  .L { color: var(--few); }
  .X { color: var(--full); }
  .N { color: var(--unk); }

    .chip { font-size: .85rem; gap: 4px; }

<body>
<main>
  <h1>高鐵餘票查詢</h1>
  <p class="meta">查詢今天起兩週內台灣高鐵各班次的剩餘座位。選好日期、起站與迄站，即可看到每班車標準車廂與商務車廂是「尚有座位」、「座位有限」或「已售完」。</p>
  <noscript><p class="warn">此頁面需要啟用 JavaScript 才能顯示即時餘位。</p></noscript>

  <div id="sentinel" aria-hidden="true"></div>
  <div class="bar" id="bar">
  <div class="date">
    <label for="date">日期</label>
    <select id="date"></select>
  </div>

  <div class="controls">
    <div>
      <label for="from">起站</label>
      <select id="from"></select>
    </div>
    <button id="swap" type="button" aria-label="對調起訖站">⇄</button>
    <div>
      <label for="to">迄站</label>
      <select id="to"></select>
    </div>
  </div>
  </div>

  <p class="opts" id="upcoming-wrap">
    <label><input type="checkbox" id="upcoming" checked> 只看尚未發車的班次</label>
  </p>

  <p class="warn" id="stale" hidden></p>
  <p class="meta" id="meta">讀取中…</p>

  <div class="board" id="board" aria-live="polite"></div>

  <p class="note">
    餘位只有「尚有座位／座位有限／已售完」三種狀態，沒有實際張數。今天的資料在營運時段約每 30 分鐘更新；未來日期約每天更新 1 到 3 次，離今天越遠更新越少。
    實際訂位請至<a href="https://www.thsrc.com.tw/" target="_blank" rel="noopener">台灣高鐵官網</a>。
    資料來源：交通部 TDX 運輸資料流通服務。
  </p>

  <p class="feedback">
    有任何問題或想法？<a href="mailto:artale.info.contact@gmail.com?subject=%E9%AB%98%E9%90%B5%E9%A4%98%E7%A5%A8%E6%9F%A5%E8%A9%A2%E5%8F%8D%E9%A5%8B%E8%88%87%E5%BB%BA%E8%AD%B0">反饋與建議</a>
  </p>
</main>

<script>
const STATIONS = [
  ['0990', '南港'], ['1000', '台北'], ['1010', '板橋'], ['1020', '桃園'],
  ['1030', '新竹'], ['1035', '苗栗'], ['1040', '台中'], ['1043', '彰化'],
  ['1047', '雲林'], ['1050', '嘉義'], ['1060', '台南'], ['1070', '左營'],
];
const LABEL = { O: '尚有座位', L: '座位有限', X: '已售完', N: '未知' };
const STALE_MIN = 90; // 今天的資料約每 30 分鐘更新，超過 90 分鐘才算過期

const $ = (id) => document.getElementById(id);
const fromEl = $('from'), toEl = $('to'), dateEl = $('date');
let data = null;
let index = null;
let loadSeq = 0;

// TDX 直接提供起訖站（OD）的餘位狀態，不需要自己合併各區間。
function query(from, to) {
  const rows = [];
  for (const t of data.trips) {
    if (t.from !== from) continue;
    const dest = t.to.find((d) => d.id === to);
    if (!dest) continue;
    rows.push({
      no: t.no, dep: t.dep, arr: data.arrivals?.[t.no]?.[to] ?? null,
      std: dest.s, biz: dest.b,
    });
  }
  return rows.sort((x, y) => x.dep.localeCompare(y.dep));
}

function nowTaipei() {
  return new Date().toLocaleTimeString('en-GB', {
    timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', hour12: false,
  });
}

function chip(v) {
  const k = v ?? 'N';
  const span = document.createElement('span');
  span.className = `chip ${k}`;
  span.textContent = LABEL[k];
  return span;
}

function render() {
  const board = $('board');
  board.replaceChildren();
  if (!data) return;

  const from = fromEl.value, to = toEl.value;
  if (from === to) {
    board.innerHTML = '<div class="empty">起站和迄站請選不同車站。</div>';
    return;
  }

  let rows = query(from, to);
  if (isToday() && $('upcoming').checked) {
    const now = nowTaipei();
    rows = rows.filter((r) => r.dep >= now);
  }

  const head = document.createElement('div');
  head.className = 'head';
  head.innerHTML = '<span>出發 / 抵達</span><span>車次</span><span>標準車廂</span><span>商務車廂</span>';
  board.append(head);

  if (rows.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = '沒有符合的班次。可以取消「只看尚未發車的班次」，或換個起訖站。';
    board.append(empty);
    return;
  }

  for (const r of rows) {
    const row = document.createElement('div');
    row.className = 'row';

    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = r.dep;
    if (r.arr) {
      const arr = document.createElement('small');
      arr.textContent = `→ ${r.arr}`;
      time.append(arr);
    }

    const no = document.createElement('span');
    no.className = 'no';
    no.textContent = r.no;

    row.append(time, no, chip(r.std), chip(r.biz));
    board.append(row);
  }
}

// 「今天」以使用者端的台北時間為準（凌晨沒有新部署時，index.json 的 today 可能還是昨天）
const todayStr = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Taipei' });
const taipeiHour = () => Number(new Date().toLocaleString('en-GB', { timeZone: 'Asia/Taipei', hour: '2-digit', hour12: false }));
const isToday = () => dateEl.value === todayStr();

function dateLabel(date, today) {
  const [y, m, d] = date.split('-').map(Number);
  const wd = '日一二三四五六'[new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
  const tag = date === today ? '（今天）' : '';
  return `${m}/${d} 週${wd}${tag}`;
}

function fmt(iso) {
  return new Date(iso).toLocaleString('zh-TW', {
    timeZone: 'Asia/Taipei', month: 'numeric', day: 'numeric',
    hour: '2-digit', minute: '2-digit', hour12: false,
  });
}

function save() {
  try { localStorage.setItem('thsr-od', JSON.stringify([fromEl.value, toEl.value])); } catch {}
}

function init() {
  for (const el of [fromEl, toEl]) {
    for (const [id, name] of STATIONS) el.add(new Option(name, id));
  }
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('thsr-od')); } catch {}
  fromEl.value = saved?.[0] ?? '1000';
  toEl.value = saved?.[1] ?? '1070';

  for (const el of [fromEl, toEl, $('upcoming')]) {
    el.addEventListener('change', () => { save(); render(); });
  }
  $('swap').addEventListener('click', () => {
    [fromEl.value, toEl.value] = [toEl.value, fromEl.value];
    save(); render();
  });

  dateEl.addEventListener('change', () => loadDay(dateEl.value));

  if ('IntersectionObserver' in window) {
    new IntersectionObserver(([e]) => {
      $('bar').classList.toggle('stuck', !e.isIntersecting);
    }).observe($('sentinel'));
  }

  fetch('data/index.json', { cache: 'no-store' })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((idx) => {
      index = idx;
      const today = todayStr();
      const dates = idx.dates.filter((d) => d >= today); // 凌晨還沒部署新資料時，濾掉已經過去的日子
      if (dates.length === 0) throw new Error('no dates');
      for (const d of dates) dateEl.add(new Option(dateLabel(d, today), d));
      loadDay(dates.includes(today) ? today : dates[0]);
    })
    .catch(() => {
      $('meta').textContent = '讀取不到餘位資料，請稍後重新整理。';
    });
}

function loadDay(date) {
  const seq = ++loadSeq;
  dateEl.value = date;
  data = null;
  $('board').replaceChildren();
  $('stale').hidden = true;
  $('upcoming-wrap').hidden = !isToday();
  $('meta').textContent = '讀取中…';

  fetch(`data/${date}.json`, { cache: 'no-store' })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((d) => {
      if (seq !== loadSeq) return; // 已切到別天，丟掉這份
      data = d;
      $('meta').textContent = `資料更新時間：${fmt(d.fetchedAt)}`;
      // 只有今天的資料會頻繁更新，才檢查是否過期
      const ageMin = (Date.now() - Date.parse(d.fetchedAt)) / 60000;
      // 只有今天、而且在營運時段才檢查；凌晨伺服器本來就不抓資料
      if (isToday() && taipeiHour() >= 6 && ageMin > STALE_MIN) {
        const w = $('stale');
        w.hidden = false;
        w.textContent = `這份資料已超過 ${Math.floor(ageMin)} 分鐘沒有更新，餘位可能已經變動，請以高鐵官網為準。`;
      }
      render();
    })
    .catch(() => {
      if (seq !== loadSeq) return;
      $('meta').textContent = '讀取不到這一天的餘位資料，請稍後重新整理。';
    });
}
init();
</script>
</body>
